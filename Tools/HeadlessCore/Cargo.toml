[package]
name = "headless_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "headless-sim"
path = "src/main.rs"

[[bin]]
name = "card-lua"
path = "src/lua.rs"
required-features = ["lua-authoring"]

[features]
default = []
lua-authoring = ["dep:mlua"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
headless_rng = { path = "../HeadlessRngRust" }
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serde"], optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
